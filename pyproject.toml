[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caveat"
version = "0.1.0"
description = "CAVEAT — Contraindication-Aware Verification of Evidence, Abstention & Traces"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "langgraph>=0.2",
    "langsmith>=0.1",
    "neo4j>=5.0",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "arize-phoenix>=4.0",
    "httpx>=0.27",
]

[project.scripts]
caveat-raw-sukl = "caveat.pipeline.raw.sukl:main"
caveat-raw-sukl-history = "caveat.pipeline.raw.sukl:main_history"
caveat-raw-sukl-spc = "caveat.pipeline.raw.sukl:main_spc"
caveat-raw-sukl-pil = "caveat.pipeline.raw.sukl:main_pil"
caveat-raw-ddinter = "caveat.pipeline.raw.ddinter:main"
caveat-raw-who-inn = "caveat.pipeline.raw.who_inn:main"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ipython",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "factory-boy>=3.3",
]
lint = [
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
]

[tool.hatch.build.targets.wheel]
packages = ["src/caveat"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: requires live Neo4j + PostgreSQL (deselect with -m 'not integration')",
    "eval: golden set evaluation scenarios (deselect with -m 'not eval')",
    "never_miss: critical safety invariants — CI hard-fails on any failure here",
]

[tool.coverage.run]
source = ["src/caveat"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
]
